name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kurulumu
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle Wrapper'ı otomatik oluştur
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            echo "gradlew bulundu."
            chmod +x ./gradlew
          else
            echo "gradlew bulunamadı."

            if [ -f "./build.gradle" ] || [ -f "./build.gradle.kts" ]; then
              echo "Proje kökünde Gradle dosyası bulundu."
              gradle wrapper
              chmod +x ./gradlew

            else
              echo "Alt klasörlerde Gradle projesi aranıyor..."

              PROJECT_DIR=$(find . -maxdepth 3 \
                \( -name "build.gradle" -o -name "build.gradle.kts" \) \
                -not -path "./.gradle/*" \
                -printf '%h\n' | head -n 1)

              if [ -z "$PROJECT_DIR" ]; then
                echo "Android/Gradle projesi bulunamadı."
                exit 1
              fi

              echo "Proje bulundu: $PROJECT_DIR"
              cd "$PROJECT_DIR"

              if [ ! -f "./gradlew" ]; then
                gradle wrapper
              fi

              chmod +x ./gradlew
            fi
          fi

      - name: APK oluştur
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            PROJECT_DIR=$(find . -maxdepth 3 \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -not -path "./.gradle/*" \
              -printf '%h\n' | head -n 1)

            cd "$PROJECT_DIR"
            ./gradlew assembleDebug
          fi

      - name: APK'yı kaydet
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
