name: Otomatik Proje İnşa Edici ve APK Derleyici

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  proje_olustur_ve_derle:
    name: Proje Altyapısını Kur ve APK Üret
    runs-on: ubuntu-latest
    steps:
    - name: Kodları İndir
      uses: actions/checkout@v4

    - name: Java 17 Ortamını Kur
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Android SDK ve Proje İskeletini Otomatik Oluştur
      run: |
        echo "=== SIFIRDAN ANDROID PROJESİ OLUŞTURULUYOR ==="
        
        # 1. Gradle ve Proje Yapısını Ayarla
        mkdir -p gradle/wrapper
        mkdir -p app/src/main/res
        mkdir -p app/src/main/java
        
        # 2. Ana build.gradle (Proje Seviyesi) Oluştur
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        # 3. settings.gradle Oluştur
        echo "include ':app'" > settings.gradle

        # 4. app/build.gradle (Uygulama Seviyesi) Oluştur
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            namespace 'com.open.source.app'
            compileSdk 34
            defaultConfig {
                applicationId "com.open.source.app"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0.0"
            }
            buildTypes {
                release {
                    minifyEnabled false
                }
            }
        }
        EOF

        # 5. Gradle Wrapper Dosyalarını İndir (İnşa Motoru)
        wget -q https://gradle.org
        unzip -q gradle-8.5-bin.zip
        mv gradle-8.5/* .
        rm -rf gradle-8.5 gradle-8.5-bin.zip
        
        # 6. Sizin Ham Kodlarınızı Yeni Projenin İçine Yerleştirme
        echo "=== DOSYALAR YENİ PROJEYE TAŞINIYOR ==="
        
        # Eğer kaynak dosyaları bir alt klasördeyse veya ana dizindeyse tespit edip taşıyalım
        if [ -d "kaynak" ]; then
          cp -r kaynak/res/* app/src/main/res/ 2>/dev/null || true
          cp -r kaynak/java/* app/src/main/java/ 2>/dev/null || true
          cp -r kaynak/src/* app/src/main/src/ 2>/dev/null || true
          cp kaynak/AndroidManifest.xml app/src/main/ 2>/dev/null || true
        else
          cp -r res/* app/src/main/res/ 2>/dev/null || true
          cp -r java/* app/src/main/java/ 2>/dev/null || true
          cp -r src/* app/src/main/src/ 2>/dev/null || true
          cp AndroidManifest.xml app/src/main/ 2>/dev/null || true
        fi

        # Eğer manifest dosyası eksikse temel bir tane oluşturalım ki derleme çökmeyin
        if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://android.com">
              <application android:allowBackup="true" android:label="Acik Kaynak Uygulama" android:theme="@android:style/Theme.Material.Light">
              </application>
          </manifest>
        EOF
        fi

    - name: Projeyi APK Olarak Derle
      run: |
        chmod +x bin/gradle || chmod +x gradlew || true
        ./bin/gradle app:assembleDebug

    - name: Derlenen Yepyeni APK'yı Telefona İndirilebilir Yap
      uses: actions/upload-artifact@v4
      with:
        name: Yepyeni-Derlenmis-APK
        path: app/build/outputs/apk/debug/*.apk
        
