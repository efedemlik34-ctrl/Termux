name: Kapsamlı Açık Kaynak Entegrasyonu ve APK Derleyici

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # 1. ADIM: GÜVENLİK VE LİSANS KONTROLÜ (Tüm Geçmişi ve Klasörü Tarar)
  guvenlik_tarama:
    name: Hassas Veri ve Güvenlik Taraması
    runs-on: ubuntu-latest
    steps:
    - name: Kodları İndir
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Gizli Şifre ve API Anahtarı Taraması (TruffleHog)
      uses: trufflesecurity/trufflehog@main
      with:
        base: "" # İlk commit'ten itibaren tüm geçmişin taranmasını sağlar
        head: ${{ github.ref_name }}
        extra_args: --results=verified,unknown

  # 2. ADIM: OTOMATİK APK DERLEME VE TEST
  derleme_ve_test:
    name: Android APK Derleme ve Test Süreci
    needs: guvenlik_tarama
    runs-on: ubuntu-latest
    steps:
    - name: Kodları İndir
      uses: actions/checkout@v4

    - name: Java 17 Ortamını Kur
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Gradle Çalıştırma İzinlerini Düzenle
      run: chmod +x gradlew

    - name: Kod Kalitesi ve Hata Taraması (Lint)
      run: ./gradlew lintDebug --continue

    - name: Güvenli APK Derle (Debug)
      run: ./gradlew assembleDebug

    - name: Derlenen APK Dosyasını Dışarı Aktar
      uses: actions/upload-artifact@v4
      with:
        name: Acik-Kaynak-Uygulama-APK
        path: app/build/outputs/apk/debug/app-debug.apk

  # 3. ADIM: AÇIK KAYNAK SÜRÜM NOTLARI (CHANGELOG) OLUŞTURMA
  surum_yonetimi:
    name: Otomatik Açık Kaynak Yayını
    needs: derleme_ve_test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
    - name: Kodları İndir
      uses: actions/checkout@v4

    - name: GitHub Sürümü ve Değişim Günlüğü Oluştur
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Açık Kaynak Sürümü v1.0.${{ github.run_number }}
        body: |
          ## 🚀 Yeni Açık Kaynak Sürümü Hazır!
          Bu sürüm GitHub Actions tarafından otomatik olarak derlenmiştir.
          
          ### 🛠️ Yapılan Değişiklikler:
          - Kod tabanı açık kaynak standartlarına göre tarandı.
          - Güvenlik ve gizli anahtar (API token) kontrolleri yapıldı.
          - Kararlı APK çıktısı üretildi.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
