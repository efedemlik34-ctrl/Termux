plugins {
    id 'com.android.application'
}

android {
    namespace 'com.diyaz.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.diyaz.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0-LAN'
    }

    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
